[project]
name = "jobify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishekkrsingh2023", email = "abhishekkrsingh2023kolkata@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "beanie[srv]>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.18.1",
    "motor>=3.0.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
jobify = "jobify:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
